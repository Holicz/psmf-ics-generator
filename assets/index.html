<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalendář zápasů – Hanspaulská liga podzim 2026</title>
<meta name="description" content="Stáhněte si rozpis zápasů svého týmu z Hanspaulské ligy jako kalendář .ics pro Google Kalendář, Apple Kalendář nebo Outlook.">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
</head>
<body>
<header class="site-header">
  <h1>Kalendář zápasů</h1>
  <p class="tagline">Hanspaulská liga&nbsp;– podzim 2026. Najdi svůj tým a stáhni si rozpis do kalendáře.</p>
</header>

<main>
  <section class="search" aria-labelledby="search-label">
    <label id="search-label" for="q">Hledat tým</label>
    <input
      id="q"
      type="search"
      autocomplete="off"
      autocapitalize="off"
      spellcheck="false"
      placeholder="Název týmu, liga"
      role="combobox"
      aria-expanded="false"
      aria-controls="results"
      aria-autocomplete="list">
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <ul id="results" role="listbox" aria-label="Nalezené týmy"></ul>
  </section>

  <section id="detail" class="detail" hidden aria-live="polite"></section>
</main>

<footer class="site-footer">
  <p>
    Data pocházejí z&nbsp;<a href="https://www.psmf.cz/">psmf.cz</a>.
    Stažena <time id="generated"></time>.
  </p>
</footer>

<script src="teams.js"></script>
<script src="app.js"></script>

<!-- GoatCounter: cookieless page counting, so no consent banner is required. -->
<script data-goatcounter="https://miluk.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
